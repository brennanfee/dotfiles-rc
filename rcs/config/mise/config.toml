[settings]
lockfile = true
cargo.binstall = true
node.compile = false
node.gpg_verify = true
npm.bun = true
pipx.uvx = true
python.default_packages_file = "~/.config/mise/default-python-packages"
python.uv_venv_auto = true
experimental = true
disable_backends = ["asdf","ubi"]
idiomatic_version_file_enable_tools = ["python"]

[tool_alias]
php = "vfox:php"

[tool_alias.node.versions]
lts = "24"
lts-krypton = "24"
lts-jod = "22"
lts-iron = "20"
lts-hydrogen = "18"
rolling = "25"

[tool_alias.java.versions]
lts = "corretto-25"
rolling = "corretto-25"

[tools]
# Pre-reqs
cargo-binstall = "latest"
cosign = "latest"
usage = "latest"
uv = "latest"
